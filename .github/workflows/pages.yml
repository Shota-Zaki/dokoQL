name: Check and publish static site

on:
  push:
    branches:
      - main
      - work
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate source and exercise data
        run: npm run check
      - name: Build clean Pages artifact
        run: npm run build:pages
      - name: Validate generated public files
        run: |
          test -f _site/index.html
          test -f _site/boot.js
          test -f _site/learningContent.js
          test -f _site/tableGuideEnhancer.js
          test -f _site/hintEnhancer.js
          test -f _site/sqlInputPalette.js
          test -f _site/sqlInputPalette.css
          test -f _site/retryEnhancer.js
          test -f _site/content/data-8.js
          grep -q "sqlInputPalette.js" _site/boot.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build clean Pages artifact
        run: npm run build:pages
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
