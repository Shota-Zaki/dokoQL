name: Check static site

on:
  push:
    branches:
      - main
      - work
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate source and exercise data
        run: npm run check
      - name: Validate published files
        run: |
          test -f docs/index.html
          test -f docs/boot.js
          test -f docs/learningContent.js
          test -f docs/content/data-8.js
